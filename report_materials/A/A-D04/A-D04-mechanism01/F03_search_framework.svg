  <text x="80" y="1073.6" fill="#245880" font-size="24" font-family="Microsoft YaHei, sans-serif">精确证明：仅完成全部子集枚举且独立证书验证后使用，范围是固定候选、证据、图和预算。</text>
  <text x="80" y="1109.6" fill="#245880" font-size="24" font-family="Microsoft YaHei, sans-serif">诊断、切换惩罚、真人成本标定未实现；仅比较非负代理成本。</text>
