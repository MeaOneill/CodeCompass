  <text x="900" y="652.6" fill="#245880" font-size="24" font-family="Microsoft YaHei, sans-serif">枚举全部预算内可达子集</text>
  <text x="900" y="688.6" fill="#245880" font-size="24" font-family="Microsoft YaHei, sans-serif">精确成本 / 无解仅限当前输入</text>
