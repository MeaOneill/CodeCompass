   <text style="font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start" x="43.2" y="58.32" transform="rotate(-0 43.2 58.32)">真实源码 VOI 缺校准时禁用；结构夹具先验仅验证机制。费用统一代理单位。</text>
