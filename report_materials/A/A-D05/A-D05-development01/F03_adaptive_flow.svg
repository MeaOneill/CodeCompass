   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start" x="63.072" y="134.3325" transform="rotate(-0 63.072 134.3325)">1 输入与保守门控</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'" transform="translate(63.072 170.393438)">固定源码 / 独立题目ID</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'" transform="translate(63.072 188.111859)">阅读不增加掌握证据</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'" transform="translate(63.072 205.830281)">个性化成本 α 与总预算</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start" x="397.584" y="134.3325" transform="rotate(-0 397.584 134.3325)">2 同规划器两分支</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'" transform="translate(397.584 170.393438)">直接补学 J；诊断通过/失败 J</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'" transform="translate(397.584 188.111859)">两分支先扣测验代理成本</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'" transform="translate(397.584 205.830281)">未知概率 / 超时 → 保守补学</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start" x="732.096" y="134.3325" transform="rotate(-0 732.096 134.3325)">3 四种开发策略</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'" transform="translate(732.096 170.393438)">无诊断 / 固定频率</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'" transform="translate(732.096 188.111859)">VOI选择 / VOI但禁用反馈</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'" transform="translate(732.096 205.830281)">同题池、成本、次数上限</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start" x="63.072" y="361.1325" transform="rotate(-0 63.072 361.1325)">4 接收实际独立反馈</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'" transform="translate(63.072 397.193437)">先选择，后读取模拟结果流</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'" transform="translate(63.072 414.911859)">只接受新独立题目</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'" transform="translate(63.072 432.630281)">测验费用已发生不退款</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start" x="397.584" y="361.1325" transform="rotate(-0 397.584 361.1325)">5 修复并保留历史</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'" transform="translate(397.584 397.193437)">保留已完成单元</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'" transform="translate(397.584 414.911859)">新增单元和逆序计切换费用</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'" transform="translate(397.584 432.630281)">完整顺序前缀，不按集合合并</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start" x="732.096" y="361.1325" transform="rotate(-0 732.096 361.1325)">6 独立重放与输出</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'" transform="translate(732.096 397.193437)">核对费用、先修和证据去重</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'" transform="translate(732.096 414.911859)">截断/超时不签发旧精确证书</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'" transform="translate(732.096 432.630281)">覆盖不是独立任务成功</text>
   </g>
