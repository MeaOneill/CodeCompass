   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start" x="54.396" y="152.4405" transform="rotate(-0 54.396 152.4405)">上游固定源码</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(54.396 190.809125)">boltons snapshot + LICENSE</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(54.396 209.239969)">Python AST / 依赖与 span</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(54.396 226.986406)">源码关系不等于教学先修</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start" x="392.796" y="152.4405" transform="rotate(-0 392.796 152.4405)">A：证据与联合规划</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(392.796 190.809125)">独立证据 / 项目隔离 / 去重</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(392.796 208.491969)">有序前缀 beam + 总预算</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(392.796 226.174812)">完成项覆盖与剩余修复</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start" x="731.196" y="152.4405" transform="rotate(-0 731.196 152.4405)">第三方与标准思想</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(731.196 190.809125)">Beta / beam / greedy / VOI</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(731.196 209.394141)">jsonschema / pytest / 绘图库</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(731.196 227.140578)">不复制上游规划器改名</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start" x="54.396" y="352.1973" transform="rotate(-0 54.396 352.1973)">B：应用和比较</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(54.396 390.565925)">采集界面 / 事件 / 代理评分</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(54.396 408.248769)">B2动态；B1仅历史回放</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(54.396 425.931613)">动态B1与终测评分待接入</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start" x="392.796" y="352.1973" transform="rotate(-0 392.796 352.1973)">AI辅助与核查</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(392.796 390.565925)">Codex辅助编写与自动验证</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(392.796 408.248769)">AI交叉代码检查另行记录</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(392.796 425.931613)">不替代成员/人类确认</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start" x="731.196" y="352.1973" transform="rotate(-0 731.196 352.1973)">候选交付边界</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(731.196 390.565925)">v0.1-candidate 逐文件hash</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(731.196 408.248769)">main未集成 / 不打正式标签</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(731.196 425.931613)">正式研究不放行</text>
   </g>
  </g>
  <g id="text_13">
