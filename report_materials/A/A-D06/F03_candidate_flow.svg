   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start" x="54.396" y="152.4405" transform="rotate(-0 54.396 152.4405)">1 校验与保守状态</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(54.396 190.809125)">源码 / 单元 / 独立证据</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(54.396 208.491969)">阅读只算完成覆盖</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(54.396 226.174812)">缺证据保守补学</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start" x="392.796" y="152.4405" transform="rotate(-0 392.796 152.4405)">2 联合规划</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(392.796 190.809125)">有序剩余前缀 / 先修</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(392.796 208.491969)">预算与搜索上限 / 明确超时</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(392.796 226.174812)">FEASIBLE不等于全局最优</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start" x="731.196" y="152.4405" transform="rotate(-0 731.196 152.4405)">3 完成首份材料</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(731.196 190.809125)">扣材料代理成本</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(731.196 208.491969)">保留完成前缀</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(731.196 226.174812)">不把阅读写成掌握</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start" x="54.396" y="352.1973" transform="rotate(-0 54.396 352.1973)">4 共同短测</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(54.396 390.565925)">D06控制：首材料后一次</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(54.396 408.248769)">先付同一题费用1</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(54.396 426.624097)">无新可靠p_pass不做VOI</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start" x="392.796" y="352.1973" transform="rotate(-0 392.796 352.1973)">5 证据与剩余修复</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(392.796 390.565925)">题目去重 / 接收真实或标明模拟</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(392.796 408.248769)">同规划器修复 / 完成项保留</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(392.796 425.931613)">无反馈变体只观察和扣费</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start" x="731.196" y="352.1973" transform="rotate(-0 731.196 352.1973)">6 审计与G2门禁</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(731.196 390.565925)">原始JSON/CSV + 配置hash</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(731.196 408.248769)">main=去选择：效果不可识别</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(731.196 425.931613)">终测评分缺失不写学习收益</text>
   </g>
  </g>
  <g id="text_13">
   <text style="font-size: 22px; font-family: 'Microsoft YaHei'; text-anchor: middle" x="540" y="40.62625" transform="rotate(-0 540 40.62625)">F03 收敛后的候选算法流程</text>
  </g>
  <g id="text_14">
   <text style="font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start" x="43.2" y="69.12" transform="rotate(-0 43.2 69.12)">同单位代理预算100；q=.1 / τ=.7 / W16；α=γ=0；生产VOI禁用。</text>
  </g>
  <g id="text_15">
   <text style="font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #8b2424" x="43.2" y="541.44" transform="rotate(-0 43.2 541.44)">此图定稿到候选版本；UI仍为用户点选时机，正式协议时机需B-D06接入复验。</text>
  </g>
