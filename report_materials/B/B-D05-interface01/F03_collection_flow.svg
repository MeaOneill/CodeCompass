<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1000" viewBox="0 0 1700 1000"><rect width="100%" height="100%" fill="#f5f7fb"/>
<text x="45" y="61" font-family="Microsoft YaHei,sans-serif" font-size="36" fill="#243c59">F03 | 统一阅读、诊断与反馈采集流程</text>
<text x="45" y="115" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#243c59">结构说明 · B-D05 开发实现 · 非实测效果 · 共同预算100代理单位 / 任务上限25分钟</text>
<rect x="50" y="155" width="1590" height="98" rx="12" fill="white" stroke="#b5c4d8" stroke-width="2"/>
<text x="75" y="192" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#243c59">01 固定源码与任务</text>
<text x="75" y="229" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#243c59">boltons 固定commit + 两道dev题；不读取终测答案</text>
<rect x="50" y="275" width="1590" height="98" rx="12" fill="white" stroke="#b5c4d8" stroke-width="2"/>
<text x="75" y="312" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#243c59">02 方法路线 / 相同界面</text>
<text x="75" y="349" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#243c59">B0固定、B1保存静态路线、B2贪心、Ours反馈修复</text>
<rect x="50" y="395" width="1590" height="98" rx="12" fill="white" stroke="#b5c4d8" stroke-width="2"/>
<text x="75" y="432" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#243c59">03 阅读 → 一次独立概念短测</text>
<text x="75" y="469" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#243c59">阅读不更新掌握；服务器评分；所有方法相同题目与次数</text>
<rect x="50" y="515" width="1590" height="98" rx="12" fill="white" stroke="#b5c4d8" stroke-width="2"/>
<text x="75" y="552" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#243c59">04 证据事务 → 剩余路线</text>
<text x="75" y="589" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#243c59">A learner去重；Ours调用A反馈；B0/B1保留静态路线</text>
<rect x="50" y="635" width="1590" height="98" rx="12" fill="white" stroke="#b5c4d8" stroke-width="2"/>
<text x="75" y="672" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#243c59">05 提交 / 超时 / 退出</text>
<text x="75" y="709" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#243c59">服务器单调计时包含诊断和重规划；最终独立评分仍待接入</text>
<rect x="50" y="755" width="1590" height="98" rx="12" fill="white" stroke="#b5c4d8" stroke-width="2"/>
<text x="75" y="792" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#243c59">06 去标识导出 / 按参与者汇总</text>
<text x="75" y="829" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#243c59">用户令牌、自由文本、绝对时间不导出；缺失保留NA</text>
<text x="50" y="934" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#243c59">异常支路：暂停隐藏内容；活跃会话跨进程重启或时钟跳变 → 标记缺失，暂停等待恢复。</text>
</svg>
