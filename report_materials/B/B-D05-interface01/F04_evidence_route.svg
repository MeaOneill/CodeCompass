<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1020" viewBox="0 0 1700 1020"><rect width="100%" height="100%" fill="#f5f7fb"/>
<text x="45" y="60" font-family="Microsoft YaHei,sans-serif" font-size="35" fill="#243c59">F04 | 一次独立开发短测前后：证据改变，路线保持</text>
<text x="45" y="115" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#243c59">真实浏览器操作 / Agent作答 / 固定真实源码；不是人类学习效果或生产VOI收益</text>
<rect x="50" y="160" width="780" height="310" rx="12" fill="white" stroke="#b5c4d8" stroke-width="2"/>
<text x="75" y="217" font-family="Microsoft YaHei,sans-serif" font-size="32" fill="#243c59">短测前</text>
<text x="75" y="279" font-family="Microsoft YaHei,sans-serif" font-size="34" fill="#243c59">Beta(1, 1)</text>
<text x="75" y="336" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#243c59">模型均值 0.500；10%分位下界 0.100</text>
<text x="75" y="400" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#243c59">下界低于门槛0.700 → 不能据此跳过</text>
<rect x="880" y="160" width="780" height="310" rx="12" fill="white" stroke="#b5c4d8" stroke-width="2"/>
<text x="905" y="217" font-family="Microsoft YaHei,sans-serif" font-size="32" fill="#243c59">短测后</text>
<text x="905" y="279" font-family="Microsoft YaHei,sans-serif" font-size="34" fill="#243c59">Beta(2, 1)</text>
<text x="905" y="336" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#243c59">模型均值 0.667；10%分位下界 0.316</text>
<text x="905" y="400" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#243c59">下界低于门槛0.700 → 不能据此跳过</text>
<rect x="50" y="515" width="1610" height="240" rx="12" fill="white" stroke="#b5c4d8" stroke-width="2"/>
<text x="75" y="565" font-family="Microsoft YaHei,sans-serif" font-size="30" fill="#243c59">路线对比（剩余材料）</text>
<text x="75" y="622" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#243c59">前：u_chunked_iter → u_iterable</text>
<text x="75" y="682" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#243c59">后：u_chunked_iter → u_iterable</text>
<text x="50" y="825" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#243c59">Beta均值与分位数是未校准模型状态，不是人群成功率；同一道题不能重复累积证据。</text>
<text x="50" y="885" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#243c59">无真实概率校准，生产VOI仍禁用；没有因展示效果而补造路线变化。</text>
<text x="50" y="943" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#243c59">数据：B-D05-browser01/agent_browser/export01/events.json；独立源码任务结果尚未评分。</text>
